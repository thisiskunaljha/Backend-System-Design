{% load socialaccount %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - Community Feed</title>
    <style>
        body { margin: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #0f172a; color: #e5e7eb; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .login-container { width: 100%; max-width: 400px; padding: 24px; }
        .card { background: rgba(86, 106, 155, 0.9); border-radius: 16px; padding: 40px; box-shadow: 0 18px 45px rgba(0,0,0,0.6); border: 1px solid rgba(148,163,184,0.35); backdrop-filter: blur(18px); }
        .card h2 { text-align: center; margin-top: 0; margin-bottom: 30px; font-size: 1.8rem; font-weight: 600; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 6px; font-weight: 500; color: #d1d5db; }
        input { width: 100%; padding: 10px 12px; border: 1px solid #334155; border-radius: 8px; background: rgba(15, 23, 42, 0.85); color: #e5e7eb; font-size: 0.95rem; box-sizing: border-box; }
        input:focus { outline: none; border-color: #38bdf8; box-shadow: 0 0 0 1px rgba(56,189,248,0.5); }
        button, .social-google { width: 100%; padding: 10px; border: none; border-radius: 8px; font-size: 0.95rem; cursor: pointer; font-weight: 600; }
        button { background: linear-gradient(135deg, #0ea5e9, #22c55e); color: #0b1120; transition: filter 0.2s; }
        button:hover { filter: brightness(1.1); }
        .social-google { background: #ffffff; color: #000; border: 1px solid #d1d5db; text-align: center; text-decoration: none; display: block; margin-top: 10px; }
        .social-google:hover { background: #f3f4f6; }
        .login-link { text-align: center; margin-top: 20px; font-size: 0.9rem; }
        .login-link a { color: #38bdf8; text-decoration: none; }
        .login-link a:hover { text-decoration: underline; }
        .back-link { text-align: center; margin-bottom: 20px; }
        .back-link a { color: #9ca3af; text-decoration: none; font-size: 0.9rem; }
        .back-link a:hover { color: #d1d5db; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="card">
            <div class="back-link"><a href="/">← Back to Feed</a></div>
            <h2>Community Feed Login</h2>

            {% if form.non_field_errors %}
            <ul class="errorlist">{% for error in form.non_field_errors %}<li>{{ error }}</li>{% endfor %}</ul>
            {% endif %}

            <form method="post">{% csrf_token %}
                <div class="form-group"><label>Username</label><input type="text" name="login" required autofocus></div>
                <div class="form-group"><label>Password</label><input type="password" name="password" required></div>
                <div class="form-group"><button type="submit">Login</button></div>
            </form>

            <a href="/accounts/google/login/" class="social-google">✓ Continue with Google</a>

            <div class="login-link">Don't have an account? <a href="{% url 'account_signup' %}">Sign up here</a></div>
        </div>
    </div>
</body>
</html>
